<script type="text/x-dc" data-dc-script data-props='{"mobile":{"editor":"boolean","default":false},"brand":{"editor":"color","default":"#1E5873","options":["#1E5873","#2B6E8F","#123B5C","#2F6B69"]},"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const brand = this.props.brand ?? '#1E5873';
    const m = !!this.props.mobile || !!st.narrow;
    if (!this._setRoot) {
      this._setRoot = (el) => {
        if (!el || this._ro || typeof ResizeObserver === 'undefined') return;
        this._ro = new ResizeObserver((es) => {
          const n = es[0].contentRect.width < 760;
          if (n !== !!(this.state || {}).narrow) this.setState({ narrow: n });
        });
        this._ro.observe(el);
      };
    }
    return { brand: brand, m: m, setRoot: this._setRoot };
  }
  componentWillUnmount() { if (this._ro) this._ro.disconnect(); }
}
</script>
