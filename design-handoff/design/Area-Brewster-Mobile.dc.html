<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brewster — Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; background: #FFFFFF; font-family: 'Instrument Sans', system-ui, sans-serif; color: #0F2433">
  <dc-import name="Area" town="brewster" mobile="{{ true }}" brand="{{brand}}" hint-size="390px,10500px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#1E5873","options":["#1E5873","#2B6E8F","#123B5C","#2F6B69"]},"$preview":{"width":390,"height":10500}}'>
class Component extends DCLogic {
  renderVals() {
    return { brand: this.props.brand ?? '#1E5873' };
  }
}
</script>
</body>
</html>
